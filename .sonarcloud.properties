# SonarCloud automatic-analysis settings.
# command-specs.generated.ts is machine-generated from the live command tree by
# cli/scripts/generate-command-specs.mjs; every command spec repeats the same
# field skeleton by design, so exclude it from copy-paste detection.
sonar.cpd.exclusions=cli/src/commands/command-specs.generated.ts

# Not shipped to users: benchmarks, demos, examples, tests, fixtures, archived specs, release and golden-image
# tooling, and the editor plugins. They take CLI arguments by design (LLM-driven scripts), run only in CI or on a
# maintainer's machine, and made up most of the open security findings.
sonar.exclusions=scripts/benchmark/**,scripts/benchmarks/**,scripts/bench/**,scripts/demo/**,scripts/golden/**,scripts/release/**,docs/benchmarks/**,tests/**,examples/**,bench/**,openspec/**,plugins/**

# Automatic analysis reads only the settings above from this file; it ignores sonar.issue.ignore.multicriteria.
# Rule-level ignores (S4036, S5332, S7631, S870x, S8348, S4507) live in SonarCloud:
# Administration > General Settings > Analysis Scope > Ignore Issues > Multi-criteria.
