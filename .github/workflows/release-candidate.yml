# Release candidate (#1387, tracker #1388): packs this commit's CLI, checks the tarball in a clean container (the same
# lifecycle script as package-lifecycle-smoke.yml), then runs the release-blocking E2E cases against that exact tarball on
# clean runners: the quickstart journey and every resource-type suite whose triggers include "release". The nightly matrix
# stays in its own workflows. release-binaries.yml's publish job reads this workflow's green runs by commit SHA and refuses
# to publish a commit that has none.
# Runs on a release/* branch (workflow_dispatch) or an rc-* tag only, never on every push. A pull request does not run it.
name: 🏷️ RELEASE | Validation | Candidate

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also start release-binaries.yml on this same branch once every candidate job has passed; it publishes this exact commit"
        type: boolean
        default: false
  push:
    tags: ["rc-*"]

permissions:
  contents: read

# The newest candidate for a version wins: attempts run on successive release/<version>-rcN branches or rc-* tags, so a
# group keyed on the ref (the old rule) never cancelled the attempt it replaced, and a stale candidate kept its runners
# (1.4.31's rc5 sat queued while main moved, #3093). A workflow-level group cannot read a job output, so `version`
# derives the key and every later job joins release-candidate-<version>-<job>: a newer run's job cancels the older
# run's same job as soon as it queues, in progress or pending.
jobs:
  version:
    name: release-candidate / version
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # release/1.4.31-rc5 and rc-1.4.31-b both name the version 1.4.31; an unmatched ref falls back to itself, so a
      # stray dispatch still gets a unique group.
      - name: Read the candidate version from the ref
        id: version
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          ref="${ref#refs/tags/}"
          case "$ref" in
            release/*) version="${ref#release/}"; version="${version%-rc*}" ;;
            rc-*)      version="${ref#rc-}"; version="${version%-rc*}"; version="${version%-[a-z]}"; version="${version%-[0-9]}" ;;
            *)         version="$ref" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  plan:
    name: release-candidate / plan
    needs: version
    concurrency:
      group: release-candidate-${{ needs.version.outputs.version }}-plan
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
          package-manager-cache: false
      # Every language, HTTP framework and frontend the registry declares: a release candidate covers the full release-blocking set.
      - name: Build the resource-type matrix for the release trigger
        id: matrix
        run: |
          languages="$(node tests/e2e/lib/registry-axes.mjs | jq -r '.language | join(",")')"
          frameworks="$(node tests/e2e/lib/registry-axes.mjs | jq -r '.httpFramework | join(",")')"
          frontends="$(node tests/e2e/lib/registry-axes.mjs | jq -r '.frontendFramework | join(",")')"
          matrix="$(node tests/e2e/lib/suite-matrix.mjs resource-types release "$languages" "$frameworks" "$frontends")"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: release-candidate / package
    needs: version
    concurrency:
      group: release-candidate-${{ needs.version.outputs.version }}-package
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      # Only a release/* branch or an rc-* tag may produce a candidate. A manual run elsewhere fails here, so the
      # publish gate can never be satisfied by a run that was not meant as a candidate.
      - name: Check the ref is a release branch or an rc tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*|refs/tags/rc-*) echo "Release candidate for $GITHUB_REF at $GITHUB_SHA" ;;
            *)
              echo "::error::Release candidates run on a release/* branch or an rc-* tag, not $GITHUB_REF"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The compiled binaries are byte-identical only for one Bun version; .bun-version is that pin. Bump it on purpose.
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: npm run build

      - name: Read the candidate version
        id: version
        run: |
          echo "version=$(node -p "require('./cli/package.json').version")" >> "$GITHUB_OUTPUT"
          # The legs read this name from here, not from github.run_attempt: "Re-run failed jobs" keeps this job's attempt-1
          # output and artifact, so a re-run of one flaky leg still finds the tarball the candidate checked.
          echo "artifact=release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # Pack the root package (the tarball users install) and stage it with the lifecycle script and cli/package.json,
      # as package-lifecycle-smoke.yml does, so the container never sees the source tree.
      - name: Pack the CLI tarball
        run: |
          mkdir -p "$RUNNER_TEMP/rc-lifecycle"
          packed="$(npm pack --pack-destination "$RUNNER_TEMP/rc-lifecycle" --silent)"
          mv "$RUNNER_TEMP/rc-lifecycle/$packed" "$RUNNER_TEMP/rc-lifecycle/flisk-cli.tgz"
          cp cli/package.json scripts/package-lifecycle-smoke.sh scripts/install-global.mjs "$RUNNER_TEMP/rc-lifecycle/"

      # The same script as the packed CLI lifecycle smoke: install the previous release, upgrade to this tarball, check the version,
      # run --help, uninstall. Clean Node 22 container, no Tilt or Docker project.
      - name: Install, upgrade, uninstall the packed CLI in a clean container
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/rc-lifecycle:/lifecycle:ro" \
            node:22-bookworm-slim \
            bash /lifecycle/package-lifecycle-smoke.sh /lifecycle/flisk-cli.tgz /lifecycle/package.json

      # The leg jobs install this exact file, so every case tests the tarball that was checked above.
      - name: Upload the candidate tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ runner.temp }}/rc-lifecycle/flisk-cli.tgz
          if-no-files-found: error
          retention-days: 3

  quickstart:
    name: release-candidate / quickstart
    needs: [version, package]
    concurrency:
      group: release-candidate-${{ needs.version.outputs.version }}-quickstart
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Download the candidate tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/rc-tarball

      - name: Install the candidate tarball
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          tarball: ${{ runner.temp }}/rc-tarball/flisk-cli.tgz

      - name: Check the candidate version
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: test "$(flisk --version)" = "$VERSION"

      - name: Run the quickstart cases (Q1-Q4)
        env:
          FLISK_VERSION: ${{ needs.package.outputs.version }}
        run: tests/e2e/journeys/quickstart/run.sh Q1 Q2 Q3 Q4

      - name: Diagnostics on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/shop" 2>/dev/null || exit 0
          echo "::group::flisk up log (last 300 lines)"
          tail -300 up.log 2>/dev/null || true
          echo "::endgroup::"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          flisk doctor || true

      - name: flisk down
        if: always()
        run: tests/e2e/journeys/quickstart/run.sh cleanup

  resource-types:
    name: release-candidate / resource-types / ${{ matrix.label }}
    needs: [version, plan, package]
    # One group per version and leg: legs of one run stay parallel, and a newer run's leg replaces the older run's
    # same leg instead of waiting for all of it.
    concurrency:
      group: release-candidate-${{ needs.version.outputs.version }}-resource-types-${{ matrix.label }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      # The legs are short (about 95 s each) and independent, so the cap sets the wall time: at 10, the 30 legs of 1.4.38 ran in
      # about 3 waves and the candidate took 10 minutes, the longest wait in a release. 15 runs them in 2 waves (about 5 minutes)
      # and still leaves 5 of the shared pool's 20 concurrent jobs for the release build and other workflows during that window.
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Download the candidate tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/rc-tarball

      - name: Install the candidate tarball
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          tarball: ${{ runner.temp }}/rc-tarball/flisk-cli.tgz

      - name: Check the candidate version
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: test "$(flisk --version)" = "$VERSION"

      - name: Tool versions and commit
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "node: $(node --version)"
          echo "docker: $(docker --version)"
          echo "tilt: $(tilt version)"
          echo "flisk: $(flisk --version)"

      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
          LANGUAGE: ${{ matrix.language }}
          FRAMEWORK: ${{ matrix.framework }}
          BYO_VARIANT: ${{ matrix.variant }}
        run: tests/e2e/resource-types/"$SUITE"/run.sh all

      - name: Collect diagnostics
        if: failure()
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/resource-types/"$SUITE"/run.sh diagnostics

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/flisk-e2e/${{ matrix.suite }}/artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/resource-types/"$SUITE"/run.sh cleanup

  # Always runs, so the candidate always reports a result. Every job above must have succeeded: a skipped or cancelled leg
  # is not a pass, because release-binaries.yml trusts a green run of this workflow as "the release-blocking E2E passed".
  gate:
    name: release-candidate
    needs: [version, plan, package, quickstart, resource-types]
    concurrency:
      group: release-candidate-${{ needs.version.outputs.version }}-gate
      cancel-in-progress: true
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report the result
        env:
          PLAN: ${{ needs.plan.result }}
          PACKAGE: ${{ needs.package.result }}
          QUICKSTART: ${{ needs.quickstart.result }}
          RESOURCE_TYPES: ${{ needs.resource-types.result }}
        run: |
          echo "plan: $PLAN; package: $PACKAGE; quickstart: $QUICKSTART; resource-types: $RESOURCE_TYPES"
          for result in "$PLAN" "$PACKAGE" "$QUICKSTART" "$RESOURCE_TYPES"; do
            if [ "$result" != "success" ]; then
              echo "::error::A release-candidate job did not succeed ($result)"
              exit 1
            fi
          done
          echo "Release candidate passed."

  # Opt-in (`-f release=true`): start the release on this same ref once `gate` has passed. Started earlier, its `publish` job
  # held a runner for minutes waiting for the suites (#3979); now that wait (check-release-candidate.mjs --wait) is only the
  # seconds this job takes, and a candidate that fails starts no release. It publishes exactly the commit tested here, so merges
  # into main meanwhile cannot void the candidate (1.4.24). A workflow_dispatch made with github.token does start the
  # workflow (GitHub's exception for workflow_dispatch).
  release:
    name: release-candidate / dispatch release
    needs: [version, plan, gate]
    concurrency:
      group: release-candidate-${{ needs.version.outputs.version }}-release
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' && inputs.release && needs.gate.result == 'success' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch release-binaries.yml on this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          gh workflow run release-binaries.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
          echo "::notice::Dispatched release-binaries.yml on ${REF} (${GITHUB_SHA})."
