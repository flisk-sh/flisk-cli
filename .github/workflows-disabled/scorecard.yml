# OpenSSF Scorecard: scores the repo's security practices and publishes the result for the README badge.
# Needs no account or secret; results are published with the workflow's OIDC token.
name: 📅 WEEKLY | Security | Scorecard

on:
  schedule:
    - cron: "41 5 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: 🏅 Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF results
      id-token: write # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
