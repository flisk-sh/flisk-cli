# Hand-written fixture for the exporter parity test, exercising the documented
# differences the permissively licensed adopter trims do not cover: kebab
# renames with network aliases, env_file re-emission, deploy reservations,
# expose and container_name drops, custom networks and the init/restart
# defaults. Verified with flisk-import and @flisk-sh/flisk-export.

services:
  shop_web:
    image: shop/web:1.2.3
    container_name: shop-web
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - shop
    deploy:
      resources:
        limits:
          cpus: "1.5"
        reservations:
          memory: 256M
    depends_on:
      - shop_db
    healthcheck:
      test: "curl -f http://localhost:8080/health"
      interval: 10s

  shop_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - shop
    volumes:
      - db-data:/var/lib/postgresql/data

networks:
  shop:
    name: shop-internal

volumes:
  db-data:
